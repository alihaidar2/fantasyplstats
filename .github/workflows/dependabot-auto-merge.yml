name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's minor and patch updates (npm and
# GitHub Actions). Major updates stay manual.
#
# `gh pr merge --auto` only waits for *required* status checks, so this relies
# on master's branch protection requiring "Lint, Test and Build" (ci.yml).
# Without that rule it would merge immediately, untested.
#
# A merge made through this workflow's GITHUB_TOKEN doesn't trigger other
# workflows, so it doesn't deploy on push: the next scheduled deploy (every
# 30 minutes on match days, 2 hours otherwise) builds and publishes it.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'alihaidar2/fantasyplstats'
    runs-on: ubuntu-latest
    name: Auto-merge minor and patch updates
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 🔎 Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      # A grouped PR reports its largest update type, so a group with any
      # major update is left for a person.
      - name: 🤖 Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
