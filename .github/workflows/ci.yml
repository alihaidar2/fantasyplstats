name: CI

# Checks every pull request: lint, typecheck, tests and a full static build.
# The build uses the recorded snapshot in test/fixtures/ (npm run
# fetch:fixtures), so PRs never call the live FPL API and don't fail when FPL
# is down or mid-update.

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR cancels that PR's previous run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Lint, Test and Build
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧾 Typecheck
        run: npm run typecheck

      - name: 🧪 Test
        run: npm test

      # Recorded responses only: no FPL requests.
      - name: 📼 Build FPL snapshot from fixtures
        run: npm run fetch:fixtures

      # With no recaps (RECAP_CONTENT_DIR names a folder that doesn't exist), so
      # this build always checks the home page's no-recap fallback, even once
      # content/recaps/ has recaps. npm test validates content/recaps/ itself.
      - name: 🛠️ Build static site
        run: npm run build
        env:
          RECAP_CONTENT_DIR: test/fixtures/no-recaps

      # Player 1 (Raya) is in test/fixtures/bootstrap-static.json.
      - name: ✅ Check build output
        run: |
          for file in out/index.html out/health.json out/players/1/index.html out/recap/index.html; do
            test -s "$file" || { echo "::error::Missing or empty $file"; exit 1; }
          done
          if grep -q 'Latest recap' out/index.html; then echo "::error::The no-recap build shows a recap"; exit 1; fi
          echo "Build output looks complete."

      # Again with the hand-written GW4 sample recap from test/fixtures/recaps/,
      # so every PR also builds the recap pages and the home page's recap block.
      # The sample never goes into content/recaps/, so it can't be published.
      - name: 🛠️ Build static site with a fixture recap
        run: npm run build
        env:
          RECAP_CONTENT_DIR: test/fixtures/recaps

      - name: ✅ Check recap build output
        run: |
          for file in out/index.html out/recap/index.html out/recap/2026-27/gw4/index.html; do
            test -s "$file" || { echo "::error::Missing or empty $file"; exit 1; }
          done
          grep -q 'href="/recap/2026-27/gw4/"' out/index.html || { echo "::error::The home page doesn't link to the recap"; exit 1; }
          grep -q '/recap/2026-27/gw4/' out/sitemap.xml || { echo "::error::The sitemap doesn't list the recap"; exit 1; }
          echo "Recap pages built."
