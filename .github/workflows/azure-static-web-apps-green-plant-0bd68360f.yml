name: Azure Static Web Apps CI/CD

# Fetches FPL data, builds the site as static files (out/) and deploys them.
# If FPL is down or its data fails validation, the run fails before deploying
# and the last good version stays live.

on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, closed]
  # GitHub cron is UTC. scripts/plan-run.ts decides whether each run deploys
  # (UK match days, GMT/BST); test/schedule.test.ts keeps these in sync with
  # SCHEDULES in src/lib/fpl/schedule.ts. Schedules only run on master.
  schedule:
    - cron: "5,35 * * * *" # every 30 minutes, on days with Premier League matches
    - cron: "20 */2 * * *" # every 2 hours, on days without matches
    - cron: "40 0 * * *" # 01:40 UK during BST, after the nightly price change
    - cron: "40 1 * * *" # 01:40 UK during GMT
  workflow_dispatch:
    inputs:
      full:
        description: Refetch every player's element-summary instead of reusing the previous snapshot
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_and_deploy:
    # - A closed PR only needs its preview environment closed (below).
    # - Dependabot PRs can't read Actions secrets, so they can't deploy a
    #   preview; ci.yml still checks them.
    # - A non-PR run deploys to production, so a manual run only deploys from
    #   master, never from another branch.
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'closed')
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    name: Build and Deploy
    timeout-minutes: 20
    permissions:
      contents: read
      # The deploy action comments the preview URL on pull requests.
      pull-requests: write
    # Production deploys queue rather than overlap; a newer push to a PR
    # cancels that PR's previous run.
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      # The previous snapshot lets match-day runs refetch only the players
      # whose teams have played, and tells the scheduler whether today is a
      # match day.
      - name: ♻️ Restore previous FPL snapshot
        uses: actions/cache/restore@v6
        with:
          path: .data/snapshot.json
          key: fpl-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fpl-snapshot-

      - name: 🗓️ Decide whether to deploy
        id: plan
        run: npx tsx scripts/plan-run.ts
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}

      - name: 🔍 Lint
        if: steps.plan.outputs.run == 'true'
        run: npm run lint

      - name: 🧾 Typecheck
        if: steps.plan.outputs.run == 'true'
        run: npm run typecheck

      - name: 🧪 Test
        if: steps.plan.outputs.run == 'true'
        run: npm test

      - name: ⚽ Fetch FPL data
        if: steps.plan.outputs.run == 'true'
        run: npm run fetch -- ${{ inputs.full && '--full' || '' }}

      - name: 🛠️ Build static site
        if: steps.plan.outputs.run == 'true'
        run: npm run build

      - name: 💾 Save FPL snapshot
        if: steps.plan.outputs.run == 'true'
        uses: actions/cache/save@v6
        with:
          path: .data/snapshot.json
          key: fpl-snapshot-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 🚀 Deploy to Azure Static Web Apps
        if: steps.plan.outputs.run == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_PLANT_0BD68360F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Deploy the prebuilt static export as-is.
          app_location: "out"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request:
    # Dependabot PRs never get a preview, and can't read the deploy token.
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: 🧹 Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_PLANT_0BD68360F }}
          action: "close"

  # GitHub disables scheduled workflows in public repos after 60 days without
  # repository activity, which would stop deploys over the off-season.
  # Enabling a workflow through the API resets that timer without a commit
  # (a commit to master would deploy). This runs once a day from the 01:40 UK
  # (GMT) slot whether or not that slot deploys; freshness.yml does the same,
  # so each scheduled workflow keeps both alive. Schedules only run on master.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '40 1 * * *'
    runs-on: ubuntu-latest
    name: Keep scheduled workflows enabled
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 💓 Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for workflow in azure-static-web-apps-green-plant-0bd68360f.yml freshness.yml; do
            gh api -X PUT "repos/$REPO/actions/workflows/$workflow/enable"
            echo "Enabled $workflow"
          done
